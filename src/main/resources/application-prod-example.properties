# CONFIGURACI\u00D3N DE PRODUCCI\u00D3N (DATOS REALES TIENDA)
# Si existe la variable SPRING_DATASOURCE_URL (inyectada por Docker), usa esa. Si no, usa localhost (para ejecuci\u00F3n directa).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aemas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGEME}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# EN PRODUCCI\u00D3N SOLO VALIDAR, PROHIBIDO MODIFICAR LA BBDD AUTOM\u00C1TICAMENTE
spring.jpa.hibernate.ddl-auto=validate

# En producci\u00F3n ocultamos el SQL para no saturar la consola/logs de texto innecesario
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
