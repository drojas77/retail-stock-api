<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mostrador de Ventas - Terminal de Caja</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #28a745; padding-bottom: 10px; }

        /* Contenedor de la cámara */
        .camera-container { max-width: 400px; margin: 0 auto 20px auto; border: 2px dashed #6f42c1; border-radius: 8px; padding: 10px; background: #f8f9fa; text-align: center; }
        #reader { width: 100%; border: none !important; }
        .camera-controls { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
        .btn-cam { background-color: #6f42c1; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-cam.stop { background-color: #6c757d; }

        .scan-section { display: flex; gap: 10px; margin-bottom: 20px; }
        .scan-section input { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; font-weight: bold; }
        .scan-section input:focus { border-color: #28a745; outline: none; }
        .scan-section button { background-color: #28a745; color: white; border: none; padding: 0 25px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .scan-section button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; }
        .total-box { text-align: right; font-size: 22px; font-weight: bold; color: #333; margin-bottom: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; }
        .checkout-section { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 6px; }
        .payment-options select { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; margin-right: 10px; }
        .btn-checkout { background-color: #007bff; color: white; padding: 12px 30px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-checkout:hover { background-color: #0069d9; }
        .btn-danger { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-danger:hover { background-color: #c82333; }
        .alert { padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🛒 Terminal de Ventas de Mostrador</h2>
        <a th:href="@{/index}" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px;">
            Volver a Principal
        </a>
        <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
        <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

        <div class="camera-container">
            <label class="mb-2 d-block">📷 Lector QR de Mostrador</label>
            <div id="reader"></div>
            <div class="camera-controls">
                <button type="button" class="btn-cam" id="btnIniciarCam" onclick="encenderCamara()">Activar Cámara</button>
                <button type="button" class="btn-cam stop" id="btnDetenerCam" onclick="apagarCamara()" style="display:none;">Apagar</button>
            </div>
        </div>

        <div class="scan-section">
            <input type="text" id="qrInput" placeholder="O pica el código QR a mano aquí..." autocomplete="off">
            <button type="button" onclick="buscarArticulo(document.getElementById('qrInput').value)">Añadir</button>
        </div>
        <div id="errorScan" style="color: red; font-weight: bold; margin-bottom: 15px; display: none;"></div>

        <table>
            <thead>
            <tr>
                <th>Código QR</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Color</th>
                <th>Talla</th>
                <th>Precio</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody id="carritoCuerpo">
            <tr id="filaVacia">
                <td colspan="7" style="text-align: center; color: #888; padding: 20px;">No hay ningún zapato en el ticket actual.</td>
            </tr>
            </tbody>
        </table>

        <div class="total-box">
            Total Ticket: <span id="totalTicket">0.00</span> €
        </div>

        <form th:action="@{/ventas/procesar}" method="POST" id="formVenta" onsubmit="return validarEnvio()">
            <div id="hiddenInputsContainer"></div>
            <div class="checkout-section">
                <div class="payment-options">
                    <label for="metodoPago">Método de Pago: </label>
                    <select name="metodoPago" id="metodoPago" required>
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TARJETA">💳 Tarjeta Bancaria</option>
                    </select>
                </div>
                <button type="submit" class="btn-checkout">🔒 Confirmar y Cobrar</button>
            </div>
        </form>
    </div>

</div>

<script>
    let carrito = [];
    let html5QrCode = null;

    // Captura la tecla INTRO en el cuadro manual
    document.getElementById("qrInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            buscarArticulo(this.value);
        }
    });

    // --- MOTOR DEL ESCÁNER POR CÁMARA ---

    let escaneandoEnProceso = false; // Flag para bloquear lecturas múltiples consecutivas

    function encenderCamara() {
        document.getElementById("errorScan").style.display = "none";
        html5QrCode = new Html5Qrcode("reader");

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        };

        // 'environment' le dice al móvil que use obligatoriamente la cámara TRASERA (la buena)
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (qrCodeText) => {

                // 1. Si ya estamos procesando un código leídos hace menos de 1.5s, ignoramos el fotograma
                if (escaneandoEnProceso) {
                    return;
                }

                // 2. Activamos el bloqueo
                escaneandoEnProceso = true;

                // 3. Ejecutamos la lógica existente
                ejecutarPitido();
                buscarArticulo(qrCodeText);

                // 4. Liberamos el bloqueo tras 1.5 segundos para poder escanear la siguiente caja
                setTimeout(() => {
                    escaneandoEnProceso = false;
                }, 1500);
            },
            (errorMessage) => {
                // Silenciamos los errores de escaneo continuo (no ha visto un QR todavía)
            }
        ).then(() => {
            document.getElementById("btnIniciarCam").style.display = "none";
            document.getElementById("btnDetenerCam").style.display = "inline-block";
        }).catch(err => {
            mostrarError("No se pudo acceder a la cámara. Asegúrate de dar permisos de vídeo.");
        });
    }

    function apagarCamara() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById("btnIniciarCam").style.display = "inline-block";
                document.getElementById("btnDetenerCam").style.display = "none";
            }).catch(err => console.error("Error al apagar cámara", err));
        }
    }

    function ejecutarPitido() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, audioCtx.currentTime); // Tono de pitido de caja
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1); // Dura 0.1 segundos
    }
    // ------------------------------------

    // --- BUSCADOR GENERAL (Usa Fetch) ---
    function buscarArticulo(qrText) {
        const errorDiv = document.getElementById("errorScan");
        errorDiv.style.display = "none";

        qrText = qrText.trim();
        if (!qrText) return;

        if (carrito.some(item => item.qr === qrText)) {
            mostrarError("Este zapato ya está incluido en el ticket actual.");
            document.getElementById("qrInput").value = "";
            return;
        }

        fetch(`/api/ventas/buscar-qr?qr=${encodeURIComponent(qrText)}`)
            .then(res => {
                if (!res.ok) {
                    return res.text().then(text => { throw new Error(text) });
                }
                return res.json();
            })
            .then(producto => {
                carrito.push(producto);
                actualizarTabla();
                document.getElementById("qrInput").value = "";
            })
            .catch(err => {
                mostrarError(err.message);
                document.getElementById("qrInput").value = "";
            });
    }

    function actualizarTabla() {
        const cuerpo = document.getElementById("carritoCuerpo");
        const hiddenContainer = document.getElementById("hiddenInputsContainer");
        const totalSpan = document.getElementById("totalTicket");

        cuerpo.innerHTML = "";
        hiddenContainer.innerHTML = "";
        let totalAcumulado = 0.0;

        if (carrito.length === 0) {
            cuerpo.innerHTML = `
                <tr id="filaVacia">
                    <td colspan="7" style="text-align: center; color: #888; padding: 20px;">No hay ningún zapato en el ticket actual.</td>
                </tr>`;
            totalSpan.innerText = "0.00";
            return;
        }

        carrito.forEach((item, index) => {
            totalAcumulado += item.precio;

            cuerpo.innerHTML += `
                <tr>
                    <td><strong>${item.qr}</strong></td>
                    <td>${item.marca}</td>
                    <td>${item.modelo}</td>
                    <td>${item.color}</td>
                    <td><span style="background:#6f42c1; color:white; padding:2px 6px; border-radius:3px; font-size:12px;">${item.talla}</span></td>
                    <td>${item.precio.toFixed(2)}€</td>
                    <td><button class="btn-danger" onclick="eliminarArticulo(${index})">❌</button></td>
                </tr>`;

            hiddenContainer.innerHTML += `<input type="hidden" name="cajaIds" value="${item.cajaId}">`;
        });

        totalSpan.innerText = totalAcumulado.toFixed(2);
    }

    function eliminarArticulo(index) {
        carrito.splice(index, 1);
        actualizarTabla();
    }

    function mostrarError(msg) {
        const errorDiv = document.getElementById("errorScan");
        errorDiv.innerText = "⚠️ " + msg;
        errorDiv.style.display = "block";
    }

    function validarEnvio() {
        if (carrito.length === 0) {
            alert("El ticket está vacío. Escanea al menos un producto antes de cobrar.");
            return false;
        }
        // Apagamos la cámara antes de enviar para liberar el hardware del dispositivo
        apagarCamara();
        return true;
    }
</script>
</body>
</html>
