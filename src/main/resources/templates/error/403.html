<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Acceso No Permitido - Aemas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-lg p-4 text-center" style="max-width: 500px;">
    <div class="card-body">
        <h1 class="display-1 text-danger fw-bold">403</h1>
        <h3 class="card-title mb-3">Acceso No Permitido</h3>
        <p class="card-text text-muted mb-4">
            No tienes los permisos necesarios para acceder a este recurso del sistema.
        </p>

        <a th:href="@{/index}" class="btn btn-primary px-4 me-2">
            Volver al Inicio
        </a>
    </div>
</div>

</body>
</html>
