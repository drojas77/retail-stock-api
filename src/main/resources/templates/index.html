<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #0056b3;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .disponible { background-color: #d4edda; color: #155724; }
        .vendido { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<h1>📦 Página principal Aemas</h1>


<a th:href="@{/stock/ver}" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    👟 Inventario
</a>
<a th:href="@{/productos/nuevo}" style="display: inline-block; background-color: #E33B2E; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    👟 Producto Nuevo
</a>
<a th:href="@{/stock/repo}" style="display: inline-block; background-color: #6f42c1; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    ⚡ Reposiciones
</a>

<a th:href="@{/ventas/mostrador}" style="display: inline-block; background-color: #6f42c1; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
     Ventas
</a>

<a th:href="@{/devoluciones/mostrador}" style="display: inline-block; background-color: #6f42c1; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    Devoluciones
</a>

<!-- Botón para acceder al Arqueo de Caja -->
<a th:href="@{/arqueo}" style="display: inline-block; background-color: #0056b3; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    📊 Arqueo de Caja
</a>

<a th:href="@{/logout}" style="display: inline-block; background-color: #E33B2E; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px; margin-right: 5px;">
    Cerrar sesión
</a>

</body>
</html>
