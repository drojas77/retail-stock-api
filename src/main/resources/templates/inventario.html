<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Stock</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #6f42c1; padding-bottom: 10px; }

        /* Contenedor de selects */
        .contenedor-selects { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .filter-bar { background: #f8f9fa; padding: 12px 15px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .filter-bar select { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #6f42c1; color: white; }

        /* Badges de estado */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-disponible { background-color: #d4edda; color: #155724; }
        .badge-vendido { background-color: #f8d7da; color: #721c24; }

        /* Estilos para Controles de Paginación */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .pagination-buttons { display: flex; gap: 5px; }
        .page-btn {
            padding: 8px 14px;
            border: 1px solid #6f42c1;
            background-color: white;
            color: #6f42c1;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn:hover:not(:disabled) { background-color: #6f42c1; color: white; }
        .page-btn.active { background-color: #6f42c1; color: white; }
        .page-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .page-info { font-size: 14px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <h2>📦 Control de Inventario de Cajas</h2>
    <a th:href="@{/index}" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 15px;">
        Volver a Principal
    </a>

    <div class="contenedor-selects">
        <div class="filter-bar">
            <label for="filtroEstado" style="font-weight: bold; color: #555;">Filtrar por estado:</label>
            <select id="filtroEstado" onchange="cargarInventario(0)">
                <option value="DISPONIBLE">🟢 Disponibles en Tienda</option>
                <option value="VENDIDO">🔴 Vendidos (Histórico)</option>
                <option value="TODOS">⚪ Ver Todo el Historial</option>
            </select>
        </div>

        <div class="filter-bar">
            <label for="filtroMarca" style="font-weight: bold; color: #555;">Filtrar por Marca:</label>
            <select id="filtroMarca" onchange="cargarInventario(0)">
                <option value="">-- Todas las marcas --</option>
                <option th:each="marca : ${todasLasMarcas}" th:value="${marca.id}" th:text="${marca.nombre}"></option>
            </select>
        </div>

        <div class="filter-bar">
            <label for="tamanoPagina" style="font-weight: bold; color: #555;">Mostrar:</label>
            <select id="tamanoPagina" onchange="cargarInventario(0)">
                <option value="10">10 por pág.</option>
                <option value="25">25 por pág.</option>
                <option value="50">50 por pág.</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Código QR Único</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Color</th>
            <th>Talla</th>
            <th>Ubicación</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody id="tablaCuerpo">
        <!-- Se carga dinámicamente vía Javascript -->
        </tbody>
    </table>

    <!-- BARRA DE PAGINACIÓN -->
    <div class="pagination-container">
        <div class="page-info" id="infoPaginacion">Cargando datos...</div>
        <div class="pagination-buttons" id="botonesPaginacion"></div>
    </div>
</div>

<script>
    let paginaActual = 0;

    // Carga inicial al abrir la página
    document.addEventListener("DOMContentLoaded", function () {
        cargarInventario(0);
    });

    function cargarInventario(pagina = 0) {
        paginaActual = pagina;
        const estado = document.getElementById("filtroEstado").value;
        const marcaId = document.getElementById("filtroMarca").value;
        const size = document.getElementById("tamanoPagina").value;
        const cuerpo = document.getElementById("tablaCuerpo");

        // Construimos la URL con parámetros query
        let url = `/api/productos/cajas?estado=${estado}&page=${pagina}&size=${size}`;
        if (marcaId) {
            url += `&marcaId=${marcaId}`;
        }

        fetch(url)
            .then(res => res.json())
            .then(pageData => {
                cuerpo.innerHTML = "";

                const cajas = pageData.content; // Spring Page devuelve la lista en .content

                if (!cajas || cajas.length === 0) {
                    cuerpo.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#888; padding:20px;">No se encontraron cajas con los filtros seleccionados.</td></tr>`;
                    renderizarPaginacion(pageData);
                    return;
                }

                cajas.forEach(caja => {
                    const claseBadge = caja.estado === 'DISPONIBLE' ? 'badge badge-disponible' : 'badge badge-vendido';

                    cuerpo.innerHTML += `
                        <tr>
                            <td>${caja.id}</td>
                            <td style="font-weight: bold;">${caja.qr || caja.qrCodigoUnico}</td>
                            <td>${caja.marca}</td>
                            <td>${caja.modelo}</td>
                            <td>${caja.color}</td>
                            <td><span style="background:#e9ecef; padding:2px 6px; border-radius:3px;">${caja.talla}</span></td>
                            <td>${caja.ubicacion || caja.ubicacionAlmacen}</td>
                            <td><span class="${claseBadge}">${caja.estado}</span></td>
                        </tr>
                    `;
                });

                renderizarPaginacion(pageData);
            })
            .catch(err => console.error("Error al obtener inventario paginado:", err));
    }

    function renderizarPaginacion(pageData) {
        const infoDiv = document.getElementById("infoPaginacion");
        const botonesDiv = document.getElementById("botonesPaginacion");

        const totalElementos = pageData.totalElements || 0;
        const totalPaginas = pageData.totalPages || 0;
        const paginaActualNum = pageData.number || 0;

        // Texto informativo
        if (totalElementos === 0) {
            infoDiv.textContent = "Mostrando 0 de 0 registros";
            botonesDiv.innerHTML = "";
            return;
        }

        const desde = (paginaActualNum * pageData.size) + 1;
        const hasta = Math.min((paginaActualNum + 1) * pageData.size, totalElementos);
        infoDiv.textContent = `Mostrando ${desde} - ${hasta} de ${totalElementos} cajas`;

        // Construir botones
        let htmlBotones = "";

        // Botón Anterior
        htmlBotones += `<button class="page-btn" ${pageData.first ? 'disabled' : ''} onclick="cargarInventario(${paginaActualNum - 1})">« Ant</button>`;

        // Botones numerados (máximo 5 botones alrededor de la página actual)
        const maxBotones = 5;
        let inicio = Math.max(0, paginaActualNum - Math.floor(maxBotones / 2));
        let fin = Math.min(totalPaginas - 1, inicio + maxBotones - 1);

        if (fin - inicio + 1 < maxBotones) {
            inicio = Math.max(0, fin - maxBotones + 1);
        }

        for (let i = inicio; i <= fin; i++) {
            const claseActiva = i === paginaActualNum ? 'active' : '';
            htmlBotones += `<button class="page-btn ${claseActiva}" onclick="cargarInventario(${i})">${i + 1}</button>`;
        }

        // Botón Siguiente
        htmlBotones += `<button class="page-btn" ${pageData.last ? 'disabled' : ''} onclick="cargarInventario(${paginaActualNum + 1})">Sig »</button>`;

        botonesDiv.innerHTML = htmlBotones;
    }
</script>
</body>
</html>
